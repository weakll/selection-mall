server:
  port: 8500
spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            # 允许请求中携带的头信息
            allowedHeaders: "*"
            # 运行跨域的请求方式
            allowedMethods: "*"
            # 跨域检测的有效期,单位s
            maxAge: 36000
      routes:
        - id: service-product
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
        - id: service-user
          uri: lb://service-user
          predicates:
             - Path=/*/user/**
        - id: service-cart
          uri: lb://service-cart
          predicates:
             - Path=/api/order/cart/**
        - id: service-order
          uri: lb://service-order
          predicates:
             - Path=/api/order/orderInfo/**
        - id: service-pay
          uri: lb://service-pay
          predicates:
             - Path=/api/order/alipay/**
        # AI 客服：/api/ai/auth/** 由 AuthGlobalFilter 强制登录，其余 /api/ai/** 公开。
        # SSE 是长连接，单独放宽该路由超时，避免流被中途掐断。
        - id: service-ai
          uri: lb://service-ai
          predicates:
            - Path=/api/ai/**
          metadata:
            response-timeout: 600000
            connect-timeout: 10000
