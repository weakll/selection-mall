# 售后政策知识库
#
# 当前阶段以资源文件承载：条目少、变更低频，无需引入数据库表或向量库。
# 条目增长到需要后台维护时，再迁移到 MySQL 表（届时本文件作为初始种子数据）。
#
# 字段说明：
#   id       稳定标识，便于日志与后续增量更新
#   question 标准问法，用于向用户展示与匹配
#   keywords 命中词，覆盖同义口语表达；匹配采用"关键词包含"策略
#   answer   标准答复，模型须以此为准，不得改写金额、时限等关键数字
entries:
  - id: shipping-time
    question: 订单什么时候发货？
    keywords: [发货, 多久发, 什么时候发, 几天到, 什么时候到, 什么时候能到, 能到, 到货, 快递, 物流, 配送, 送达]
    answer: 付款后 24 小时内发货，节假日可能顺延。发货后可在"我的订单"查看物流单号。

  - id: return-policy
    question: 如何申请退换货？
    keywords: [退货, 换货, 退换, 售后, 怎么退, 想退, 要退, 不想要, 七天, 7天, 无理由, 退款, 退钱]
    answer: 支持 7 天无理由退换货。在"我的订单"找到对应订单，点击"申请售后"提交，商品需不影响二次销售。

  - id: coupon-usage
    question: 优惠券怎么使用？
    keywords: [优惠券, 优惠, 折扣, 满减, 券, 抵扣]
    answer: 在确认订单页面选择可用优惠券，系统自动计算减免金额。每笔订单限用一张，优惠券有有效期，过期不可用。

  - id: password-reset
    question: 忘记密码怎么办？
    keywords: [忘记密码, 密码, 找回密码, 改密码, 重置密码, 登不上]
    answer: 在登录页点击"忘记密码"，通过注册手机号接收验证码重置。

  - id: payment-methods
    question: 支持哪些支付方式？
    keywords: [支付, 付款, 怎么付, 微信, 支付宝, 银行卡, 付不了]
    answer: 目前支持微信支付与支付宝支付，提交订单时选择支付方式。订单需在 30 分钟内完成支付，超时自动取消。

  - id: invoice
    question: 可以开发票吗？
    keywords: [发票, 开票, 报销, 增值税]
    answer: 支持开具电子发票。下单时在备注中填写开票信息与邮箱，发货后 3 个工作日内发送至该邮箱。

  - id: order-cancel
    question: 未付款订单会自动取消吗？
    keywords: [取消订单, 自动取消, 未付款, 超时, 订单关闭]
    answer: 未付款订单在提交后 30 分钟内未支付将被自动取消，占用的库存会自动释放，可重新下单。
