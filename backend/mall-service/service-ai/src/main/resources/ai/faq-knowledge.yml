# 售后与购物政策知识库
#
# 规模：60 条，覆盖退换货、物流配送、发票、支付、优惠券、会员积分、
#       订单操作、售后维修、账号安全、购物保障十个类别。
#
# 为什么是这个规模：检索评测需要指标有区分度。条目过少（如 7 条）时
# 任何检索方法都能接近满分，四组配置的差距会被噪声淹没。
# 60 条既能产生有效区分，也是小型客服知识库的真实形态。
#
# 字段说明：
#   id       稳定标识，评测标注集通过它标注正确答案
#   category 类别，便于按类别统计召回情况
#   question 标准问法，用于向用户展示
#   keywords 口语化命中词，供关键词召回通道使用
#   answer   标准答复；模型须以此为准，不得改写时限、金额等关键数字
entries:
  # ---------- 退换货 ----------
  - id: return-7days
    category: 退换货
    question: 七天无理由退货怎么申请？
    keywords: [退货, 无理由, 七天, 7天, 怎么退, 想退, 要退, 不想要]
    answer: 签收后 7 天内可申请无理由退货。在"我的订单"找到对应订单点击"申请售后"提交，商品需不影响二次销售，吊牌与包装需完整。

  - id: return-condition
    category: 退换货
    question: 退货对商品状态有什么要求？
    keywords: [退货要求, 商品状态, 吊牌, 包装, 影响二次销售, 拆封]
    answer: 商品需保持完好、配件齐全、吊牌未剪、包装完整。已拆封的食品、贴身衣物、定制商品不支持无理由退货。

  - id: return-freight
    category: 退换货
    question: 退货运费谁承担？
    keywords: [退货运费, 运费谁出, 邮费, 运费险, 寄回运费]
    answer: 质量问题由商城承担退货运费并提供运费险；非质量问题的无理由退货，往返运费由买家承担。

  - id: exchange-flow
    category: 退换货
    question: 换货流程是怎样的？
    keywords: [换货, 换个, 换一件, 换尺码, 换颜色, 换货流程]
    answer: 在订单页申请"换货"并选择目标规格，寄回后商城验收合格即发出新商品。换货仅支持同款不同规格，不支持换其它商品。

  - id: refund-time
    category: 退换货
    question: 退款多久到账？
    keywords: [退款, 退钱, 到账, 多久退, 退款时间, 钱什么时候退]
    answer: 商城验收通过后 1 个工作日内发起退款。原路退回，微信/支付宝通常 1-3 个工作日到账，银行卡 3-7 个工作日。

  - id: no-return-goods
    category: 退换货
    question: 哪些商品不支持退货？
    keywords: [不支持退货, 不能退, 例外, 特殊商品, 定制品]
    answer: 定制商品、鲜活易腐、已拆封的食品与保健品、贴身衣物、已激活的数码产品、以及明确标注"不支持退换"的商品。

  # ---------- 物流配送 ----------
  - id: shipping-time
    category: 物流配送
    question: 订单什么时候发货？
    keywords: [发货, 多久发, 什么时候发, 几天到, 什么时候到, 什么时候能到, 能到, 到货, 快递, 物流, 配送, 送达]
    answer: 付款后 24 小时内发货，节假日可能顺延。发货后可在"我的订单"查看物流单号。

  - id: shipping-fee
    category: 物流配送
    question: 运费怎么计算？满多少包邮？
    keywords: [运费, 包邮, 邮费, 免运费, 满多少包邮, 配送费]
    answer: 单笔订单满 99 元包邮，未满收取 8 元运费。新疆、西藏、港澳台及海外地区不参与包邮，运费按下单页显示为准。

  - id: shipping-carrier
    category: 物流配送
    question: 用什么快递发货？可以指定快递吗？
    keywords: [什么快递, 哪家快递, 指定快递, 顺丰, 快递公司]
    answer: 默认合作顺丰、中通、圆通，系统按下单地址自动选择。暂不支持指定快递公司，批量订单可联系客服备注。

  - id: shipping-track
    category: 物流配送
    question: 物流信息不更新怎么办？
    keywords: [物流不更新, 查不到物流, 没动静, 物流停滞, 单号查不到]
    answer: 物流信息通常每 4-8 小时更新一次。超过 48 小时未更新请联系客服，我们会向承运方发起查件。

  - id: shipping-delay
    category: 物流配送
    question: 发货延迟有补偿吗？
    keywords: [延迟, 晚发, 补偿, 超时发货, 没按时发]
    answer: 超过承诺时效 24 小时未发货，可申请 5 元无门槛优惠券补偿；超过 72 小时可申请全额退款。

  - id: shipping-address-change
    category: 物流配送
    question: 下单后能改收货地址吗？
    keywords: [改地址, 修改地址, 收货地址, 地址写错, 换地址]
    answer: 未发货可在订单详情页自行修改一次。已发货无法修改，请联系客服协助与快递沟通改派，成功率取决于承运方。

  # ---------- 发票 ----------
  - id: invoice-electronic
    category: 发票
    question: 可以开发票吗？
    keywords: [发票, 开票, 报销, 增值税, 要发票]
    answer: 支持开具电子发票。下单时在备注填写开票信息与邮箱，发货后 3 个工作日内发送至该邮箱。

  - id: invoice-special
    category: 发票
    question: 能开增值税专用发票吗？
    keywords: [专用发票, 专票, 增值税专用, 企业开票, 抵扣]
    answer: 支持开具增值税专用发票。需提供公司名称、税号、开户行及账号、注册地址与电话，审核通过后 5 个工作日内寄出。

  - id: invoice-change
    category: 发票
    question: 发票信息填错了能重开吗？
    keywords: [发票错了, 重开, 换发票, 发票信息修改, 抬头写错]
    answer: 未开具前可在订单备注直接修改。已开具的需在 30 天内申请重开，原发票需作废，重开周期约 3 个工作日。

  - id: invoice-return
    category: 发票
    question: 退货后发票要退回吗？
    keywords: [退货发票, 发票退回, 退票, 退货开过票]
    answer: 已开具纸质专票的订单发生退货，需将发票原件寄回商城后方可完成退款；电子发票无需寄回，系统自动冲红。

  # ---------- 支付 ----------
  - id: payment-methods
    category: 支付
    question: 支持哪些支付方式？
    keywords: [支付, 付款, 怎么付, 微信, 支付宝, 银行卡, 付不了, 支付方式]
    answer: 目前支持微信支付与支付宝支付，提交订单时选择支付方式。订单需在 30 分钟内完成支付，超时自动取消。

  - id: payment-timeout
    category: 支付
    question: 未付款订单会自动取消吗？
    keywords: [取消订单, 自动取消, 未付款, 超时, 订单关闭, 没付款]
    answer: 未付款订单在提交后 30 分钟内未支付将被自动取消，占用的库存会自动释放，可重新下单。

  - id: payment-failed
    category: 支付
    question: 扣款了但订单显示未支付怎么办？
    keywords: [扣款没到账, 付了没显示, 双重扣款, 支付异常, 扣钱没订单]
    answer: 通常是支付回调延迟，5 分钟内会自动同步。超过 10 分钟仍未更新请联系客服，提供订单号与支付凭证，核实后原路退回或补单。

  - id: payment-installment
    category: 支付
    question: 支持分期付款吗？
    keywords: [分期, 花呗分期, 信用卡分期, 分几期]
    answer: 单笔订单满 500 元支持花呗分期（3/6/12 期），费率以下单页显示为准。信用卡分期由发卡行提供，商城不额外收费。

  - id: payment-security
    category: 支付
    question: 支付安全吗？会泄露银行卡信息吗？
    keywords: [支付安全, 泄露, 银行卡信息, 盗刷, 安全吗]
    answer: 商城不存储银行卡号与支付密码，支付全程由微信/支付宝的加密通道完成。若发现异常交易请立即联系发卡行冻结并告知客服。

  # ---------- 优惠券 ----------
  - id: coupon-usage
    category: 优惠券
    question: 优惠券怎么使用？
    keywords: [优惠券, 优惠, 折扣, 满减, 券, 抵扣, 怎么用券]
    answer: 在确认订单页面选择可用优惠券，系统自动计算减免金额。每笔订单限用一张，优惠券有有效期，过期不可用。

  - id: coupon-stack
    category: 优惠券
    question: 优惠券可以叠加使用吗？
    keywords: [叠加, 一起用, 多张券, 能同时用吗, 券叠加]
    answer: 同一订单仅可使用一张优惠券，不可与其它券叠加。但优惠券可与会员折扣、积分抵扣同时使用。

  - id: coupon-expire
    category: 优惠券
    question: 优惠券过期了能补发吗？
    keywords: [券过期, 过期了, 补发, 券失效, 忘记用]
    answer: 优惠券过期后自动失效，原则上不补发。若因系统故障或物流延误导致无法使用，可联系客服申请等额补偿。

  - id: coupon-refund
    category: 优惠券
    question: 订单退款后优惠券会退回吗？
    keywords: [退券, 券退回, 退款优惠券, 券还给我]
    answer: 订单取消或退货后，未过期的优惠券会在 24 小时内自动退回账户；已过期的券不退回。

  - id: coupon-get
    category: 优惠券
    question: 在哪里可以领优惠券？
    keywords: [领券, 哪里领, 领优惠券, 新人券, 免费领]
    answer: 首页领券中心、商品详情页、会员中心均可领取。新用户注册即送 3 张新人券，有效期 7 天。

  # ---------- 会员与积分 ----------
  - id: member-level
    category: 会员与积分
    question: 会员等级怎么划分？有什么权益？
    keywords: [会员等级, 会员权益, 升级, 会员制度, vip]
    answer: 按累计消费划分普通、银卡、金卡、钻石四级。银卡起享 98 折，金卡 95 折并包邮，钻石卡 92 折、专属客服与优先发货。

  - id: points-earn
    category: 会员与积分
    question: 积分怎么获得？
    keywords: [积分, 怎么得积分, 积分规则, 攒积分]
    answer: 每消费 1 元累计 1 积分；每日签到得 2 积分，连续 7 天额外得 20 积分；评价晒单得 10 积分。积分有效期为获得后 12 个月。

  - id: points-use
    category: 会员与积分
    question: 积分可以抵扣现金吗？
    keywords: [积分抵扣, 积分抵钱, 积分怎么用, 积分换钱]
    answer: 100 积分可抵扣 1 元，单笔订单最多抵扣订单金额的 20%，不可与运费叠加抵扣。

  - id: member-birthday
    category: 会员与积分
    question: 生日有专属优惠吗？
    keywords: [生日, 生日礼, 生日优惠, 生日券]
    answer: 会员在生日当月至次月月底可领取生日礼包，含 50 元无门槛券与双倍积分权益，需在会员中心主动领取。

  # ---------- 订单操作 ----------
  - id: order-cancel
    category: 订单操作
    question: 下单后可以取消吗？
    keywords: [取消订单, 不要了, 撤销, 取消购买, 下错了]
    answer: 未发货订单可随时取消，款项 1-3 个工作日原路退回。已发货订单需拒收或签收后申请退货。

  - id: order-merge
    category: 订单操作
    question: 两个订单可以合并发货吗？
    keywords: [合并订单, 一起发, 合并发货, 两个订单]
    answer: 收货地址相同且均未发货的订单可申请合并发货，联系客服提供两个订单号即可，合并后按新包裹的物流单号查询。

  - id: order-modify
    category: 订单操作
    question: 订单里的商品可以改吗？
    keywords: [改订单, 换商品, 加商品, 修改订单, 订单内容改]
    answer: 订单提交后不可修改商品与数量。需取消原订单后重新下单，取消后优惠券会在 24 小时内退回。

  - id: order-note
    category: 订单操作
    question: 可以给订单加备注吗？
    keywords: [备注, 留言, 加备注, 快递备注, 送礼]
    answer: 未发货订单可在订单详情页补充备注，内容会同步给仓库与快递。备注不支持指定送达时间。

  # ---------- 售后与维修 ----------
  - id: repair-warranty
    category: 售后与维修
    question: 商品有保修吗？保修多久？
    keywords: [保修, 质保, 保修期, 保修多久, 质量问题]
    answer: 数码类商品整机保修 1 年、主要部件 2 年；家电类整机 1 年、核心部件 3 年。人为损坏与进液不在保修范围。

  - id: repair-flow
    category: 售后与维修
    question: 保修期内怎么申请维修？
    keywords: [申请维修, 报修, 维修流程, 坏了怎么办, 修理]
    answer: 在订单页提交"维修"申请并描述故障，客服确认后提供寄修地址。保修期内往返运费由商城承担，维修周期 7-15 个工作日。

  - id: repair-out-warranty
    category: 售后与维修
    question: 过保了还能修吗？
    keywords: [过保, 保修过期, 保外维修, 还能修吗]
    answer: 支持保外付费维修。检测后报价，用户确认再维修，不确认则原样寄回且不收取检测费。往返运费由用户承担。

  - id: after-sale-dispute
    category: 售后与维修
    question: 售后处理结果不满意怎么办？
    keywords: [不满意, 投诉, 售后纠纷, 申诉, 处理结果]
    answer: 可在售后详情页申请"升级处理"，由客服主管 24 小时内介入复核。仍不满意的可向平台所在地消费者协会投诉。

  - id: fake-goods
    category: 售后与维修
    question: 买到假货怎么办？
    keywords: [假货, 假一赔十, 正品, 仿品, 假货赔偿]
    answer: 商城承诺假一赔十。请保留商品与包装并联系客服，提供品牌方或第三方的鉴定结论，核实后按承诺赔付并承担全部运费。

  # ---------- 账号与安全 ----------
  - id: password-reset
    category: 账号与安全
    question: 忘记密码怎么办？
    keywords: [忘记密码, 密码, 找回密码, 改密码, 重置密码, 登不上]
    answer: 在登录页点击"忘记密码"，通过注册手机号接收验证码重置。

  - id: phone-change
    category: 账号与安全
    question: 注册手机号换了怎么改？
    keywords: [换手机号, 改手机号, 手机号不用了, 换绑]
    answer: 若旧号仍可用，在账号安全页直接换绑；旧号已停用的，需联系客服并提供最近一笔订单号与支付凭证进行人工核验。

  - id: account-security
    category: 账号与安全
    question: 账号被盗了怎么办？
    keywords: [账号被盗, 被盗, 异常登录, 被盗刷, 账号安全]
    answer: 立即通过注册手机号重置密码并开启登录保护；如已被盗刷下单，联系客服冻结账号并提供报警回执，商城配合调查。

  - id: privacy-protection
    category: 账号与安全
    question: 个人信息会被泄露吗？
    keywords: [隐私, 信息泄露, 个人信息, 手机号泄露, 数据安全]
    answer: 手机号与地址在展示与物流面单上均做脱敏处理，商城不出售用户信息。可在设置页关闭个性化推荐并申请导出或删除个人数据。

  # ---------- 购物保障 ----------
  - id: authentic-guarantee
    category: 购物保障
    question: 商品都是正品吗？
    keywords: [正品, 保真, 是不是真的, 正品保证, 货源]
    answer: 商城所有商品均为品牌方或一级授权经销商直供，支持品牌方验真。每件商品附带防伪码，可在品牌官网核验。

  - id: price-protection
    category: 购物保障
    question: 买完就降价了能补差价吗？
    keywords: [降价, 补差价, 价保, 买贵了, 价格保护]
    answer: 支持 15 天价保。下单后 15 天内同一商品在商城官方渠道降价，可申请退还差价，需提供降价截图，每人每月限申请 3 次。

  - id: stock-shortage
    category: 购物保障
    question: 下单后没货了怎么办？
    keywords: [没货, 缺货, 库存不足, 卖完了, 无货]
    answer: 若付款后出现缺货，客服会主动联系协商更换规格或全额退款，并补偿 10 元无门槛优惠券。未付款订单缺货将自动取消。

  - id: limited-purchase
    category: 购物保障
    question: 为什么有商品限购？
    keywords: [限购, 买不了多个, 数量限制, 只能买一件]
    answer: 部分特价、新品与稀缺商品设置限购，通常每个账号每 30 天限购 1-2 件，用于防止囤货转卖、保障更多用户体验。

  - id: product-desc-diff
    category: 购物保障
    question: 收到的商品和描述不一样怎么办？
    keywords: [货不对板, 描述不符, 和图片不一样, 颜色不对, 发错货]
    answer: 请在签收后 48 小时内拍照并联系客服。核实为描述不符或发错货的，商城承担往返运费并优先补发或全额退款。

  # ---------- 其它服务 ----------
  - id: customer-service-hours
    category: 其它服务
    question: 人工客服的服务时间是什么时候？
    keywords: [客服时间, 人工客服, 几点到几点, 服务时间, 转人工]
    answer: 在线客服服务时间为每日 09:00-22:00，节假日不休。22:00 后提交的问题会在次日上午优先处理。

  - id: order-query
    category: 其它服务
    question: 怎么查询我的订单？
    keywords: [查订单, 我的订单, 订单查询, 订单在哪, 看订单]
    answer: 在"我的-我的订单"查看全部订单，可按待付款、待发货、待收货、已完成筛选。也可直接对我说订单号，我帮您查询当前状态。

  - id: wishlist
    category: 其它服务
    question: 收藏的商品会降价提醒吗？
    keywords: [收藏, 降价提醒, 我的收藏, 关注商品]
    answer: 收藏商品降价时会通过站内消息推送提醒，可在"我的-我的收藏"查看收藏清单，支持一键加入购物车。

  - id: review-reward
    category: 其它服务
    question: 评价商品有奖励吗？
    keywords: [评价, 晒单, 评价奖励, 写评价, 好评]
    answer: 订单完成后 30 天内可评价。文字评价得 10 积分，含图评价额外得 20 积分，优质评价有机会获得优惠券。

  - id: gift-wrap
    category: 其它服务
    question: 可以礼品包装吗？会显示价格吗？
    keywords: [礼品包装, 包装, 送礼, 贺卡, 显示价格]
    answer: 支持礼品包装服务，收费 5 元，可选择附带贺卡。礼品订单的包裹内不放置价格单据，金额仅在线上订单中可见。

  - id: bulk-purchase
    category: 其它服务
    question: 企业批量采购有优惠吗？
    keywords: [批量, 团购, 企业采购, 大量买, 批发]
    answer: 单笔满 50 件或金额满 5 万元可申请企业采购价，联系客服提交营业执照与采购清单，专属客户经理 1 个工作日内联系。

  - id: app-download
    category: 其它服务
    question: 有手机 App 吗？
    keywords: [app, 客户端, 下载, 手机应用, 小程序]
    answer: 目前通过手机浏览器访问 H5 商城即可下单，体验与 App 一致。微信小程序正在开发中，上线后会在首页公告。

  - id: logout-account
    category: 其它服务
    question: 怎么注销账号？
    keywords: [注销, 删号, 注销账号, 不要账号了, 删除账号]
    answer: 在"设置-账号安全-注销账号"提交申请。注销前需完成所有订单与售后，且账户余额与积分需已使用完毕，注销后数据不可恢复。

  - id: complaint-channel
    category: 其它服务
    question: 想投诉客服怎么办？
    keywords: [投诉, 投诉客服, 举报, 服务态度, 投诉渠道]
    answer: 在客服对话中发送"转投诉"即可升级至服务质量组，或在"设置-意见反馈"提交。投诉会在 24 小时内受理并回复处理结果。

  - id: coupon-new-user
    category: 优惠券
    question: 新用户有什么优惠？
    keywords: [新人, 新用户, 首次下单, 新人优惠, 注册礼]
    answer: 新注册用户立得 3 张新人券：满 99 减 20、满 199 减 50、满 499 减 120，有效期 7 天，仅限首单使用一张。

  - id: order-invoice-status
    category: 发票
    question: 怎么查看发票开具进度？
    keywords: [发票进度, 发票状态, 发票开好了吗, 查发票]
    answer: 在"我的订单-订单详情-发票信息"查看状态。显示"已开具"即可下载电子发票，显示"审核中"通常为专票人工审核阶段。

  - id: shipping-overseas
    category: 物流配送
    question: 支持配送到海外吗？
    keywords: [海外, 国外, 港澳台, 跨境, 出境]
    answer: 目前仅支持中国大陆地区配送，港澳台及海外暂不支持。海外用户可委托国内转运公司代收，转运环节的风险由用户承担。

  - id: payment-invoice-together
    category: 支付
    question: 可以货到付款吗？
    keywords: [货到付款, 到付, 收到再付, 现金支付]
    answer: 暂不支持货到付款。所有订单需在线完成支付后发货，支付方式支持微信与支付宝。

  - id: return-partial
    category: 退换货
    question: 一单多件可以只退其中一件吗？
    keywords: [部分退货, 只退一件, 退其中一件, 分开退]
    answer: 支持部分退货。在申请售后时勾选需要退货的商品即可，退款金额按该商品实付金额计算，优惠券分摊部分不予退回。

  - id: exchange-price-diff
    category: 退换货
    question: 换货遇到价格变动怎么算？
    keywords: [换货差价, 价格变动, 补差价换货, 换货价格]
    answer: 换货以原订单价格为准，不因目标规格当前售价不同而补差价或退差价。若目标规格已下架，则转为退货退款。
