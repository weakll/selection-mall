server:
  port: 8516

spring:
  application:
    name: service-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  # 数据源用途单一：存放售后政策知识库的检索索引（faq_knowledge 表，含 ngram 全文索引）。
  # 商品与订单数据仍走 Feign，不读商城业务库。数据库不可用时检索自动退回词表匹配，
  # 服务不会因此起不来（见 FaqKnowledgeSource 的降级说明）。
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:selection_mall}?serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:selection_mall}
    password: ${MYSQL_PASSWORD:change_me}
    hikari:
      # 知识库只有 63 行、低频访问，连接池给小一些即可
      maximum-pool-size: 4
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me}

# AI 客服配置。
# api-key 只从环境变量读，不落配置文件；deploy/.env 已被 .gitignore 忽略（见 .gitignore 第 21 行）。
mall:
  ai:
    enabled: ${MALL_AI_ENABLED:true}
    model:
      provider: deepseek
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      # 首字超时与整体超时：客服场景首包慢会让用户以为没反应
      connect-timeout-ms: ${MALL_AI_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${MALL_AI_READ_TIMEOUT_MS:120000}
    agent:
      max-iters: ${MALL_AI_MAX_ITERS:6}
      system-prompt: |
        你是精选商城的在线客服助手，名字叫"小选"。
        要求：
        1. 用简体中文回答，语气亲切简洁，不要输出 Markdown 表格或代码块。
        2. 涉及商品信息时调用 queryProduct 工具查询真实数据，不要编造价格和库存。
        3. 涉及用户自己的订单时调用 queryMyOrders 工具，只能查询当前登录用户自己的订单。
        4. 涉及退换货、发票、配送等政策问题时调用 searchFaq 工具，按知识库内容回答。
        5. 工具查不到的信息，如实告知用户，并建议联系人工客服，不要猜测。

logging:
  level:
    io.github.weakll.mall.ai: ${MALL_AI_LOG_LEVEL:INFO}
