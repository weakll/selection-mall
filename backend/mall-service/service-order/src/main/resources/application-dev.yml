server:
  port: 8514

spring:
  application:
    name: service-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:selection_mall}?serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:selection_mall}
    password: ${MYSQL_PASSWORD:change_me}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me}

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper.order/*.xml

mall:
  order:
    unpaid-timeout-minutes: ${ORDER_UNPAID_TIMEOUT_MINUTES:30}
    expire-scan-delay-ms: ${ORDER_EXPIRE_SCAN_DELAY_MS:60000}
    expire-batch-size: ${ORDER_EXPIRE_BATCH_SIZE:100}
    restore-compensation-scan-delay-ms: ${ORDER_RESTORE_COMPENSATION_SCAN_DELAY_MS:60000}
    restore-compensation-batch-size: ${ORDER_RESTORE_COMPENSATION_BATCH_SIZE:50}
    restore-compensation-max-retries: ${ORDER_RESTORE_COMPENSATION_MAX_RETRIES:10}
