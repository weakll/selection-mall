server:
  port: 8511

spring:
  application:
    name: service-product
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  # Redis的相关配置
  data:
   redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:selection_mall}?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:selection_mall}
    password: ${MYSQL_PASSWORD:change_me}
    hikari:
      connection-init-sql: CREATE DATABASE IF NOT EXISTS selection_mall DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:/mapper.product/*.xml
