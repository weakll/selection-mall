name: selection-mall-prod

services:
  gateway:
    build:
      context: ../backend/mall-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
    depends_on: []
    ports: ["8500:8500"]
    networks: [mall-network]

  service-user:
    build:
      context: ../backend/mall-service/service-user
    environment: &backend-env
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-selection_mall}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-selection_mall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
    depends_on: []
    networks: [mall-network]

  service-product:
    build: { context: ../backend/mall-service/service-product }
    environment: *backend-env
    depends_on: []
    networks: [mall-network]
  service-cart:
    build: { context: ../backend/mall-service/service-cart }
    environment: *backend-env
    depends_on: []
    networks: [mall-network]
  service-order:
    build: { context: ../backend/mall-service/service-order }
    environment: *backend-env
    depends_on: []
    networks: [mall-network]
  service-pay:
    build: { context: ../backend/mall-service/service-pay }
    environment:
      <<: *backend-env
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1}
    depends_on: []
    networks: [mall-network]

  h5:
    build:
      context: ..
      dockerfile: mall-h5/Dockerfile
    depends_on: [gateway]
    ports: ["80:80"]
    networks: [mall-network]

networks:
  mall-network:
    name: selection-mall-network
    external: true
